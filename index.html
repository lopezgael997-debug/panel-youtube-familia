<!-- public/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensamblador Automático de Documentales</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            color: #38bdf8;
        }
        .upload-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #94a3b8;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: var(--bg);
            border: 1px solid #334155;
            border-radius: 6px;
            color: var(--text);
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #10b981;
        }
        .spinner {
            display: none;
            margin: 0 auto 10px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Módulo de Ensamblaje de Video</h1>
        <form id="videoForm">
            <div class="upload-group">
                <label for="imagen">1. Imagen de Portada/Fondo (.jpg / .png)</label>
                <input type="file" id="imagen" accept="image/*" required>
            </div>
            <div class="upload-group">
                <label for="audio">2. Audio Narrado de XTTS (.wav / .mp3)</label>
                <input type="file" id="audio" accept="audio/*" required>
            </div>
            
            <div class="spinner" id="spinner"></div>
            
            <button type="submit" id="submitBtn">Generar Documental</button>
            <div id="status"></div>
        </form>
    </div>

    <script>
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const status = document.getElementById('status');
            const spinner = document.getElementById('spinner');
            const submitBtn = document.getElementById('submitBtn');
            
            const formData = new FormData();
            formData.append('imagen', document.getElementById('imagen').files[0]);
            formData.append('audio', document.getElementById('audio').files[0]);

            submitBtn.style.display = 'none';
            spinner.style.display = 'block';
            status.textContent = "El servidor está procesando el video. Por favor espera...";
            status.style.color = "#fbbf24";

            try {
                const response = await fetch('/ensamblar', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.style.color = "#10b981";
                    status.innerHTML = `¡Video listo! <a href="${data.downloadUrl}" download style="color: #38bdf8;">Haz clic aquí para descargar el MP4</a>`;
                } else {
                    throw new Error("Fallo en el servidor");
                }
            } catch (error) {
                status.style.color = "#ef4444";
                status.textContent = "Hubo un error al generar el video. Revisa la consola del servidor.";
            } finally {
                spinner.style.display = 'none';
                submitBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
