<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Producción | Documentales</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }

        .dashboard-card {
            background-color: var(--surface);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border);
        }

        .header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #fff; }
        .header p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.5rem; color: #cbd5e1; }
        
        input[type="text"], input[type="url"], select {
            width: 100%; padding: 0.875rem; border-radius: 8px; border: 1px solid var(--border);
            background-color: var(--bg-dark); color: #fff; font-size: 1rem; transition: border-color 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .slider-container {
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            background-color: var(--bg-dark); padding: 1rem; border-radius: 8px; border: 1px solid var(--border);
        }

        input[type="range"] { flex-grow: 1; accent-color: var(--primary); }
        .val-display { background: var(--primary); padding: 0.25rem 0.75rem; border-radius: 6px; font-weight: bold; font-size: 0.9rem; min-width: 60px; text-align: center; }

        .submit-btn {
            width: 100%; padding: 1rem; margin-top: 1rem; background-color: var(--primary);
            color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: background-color 0.2s, transform 0.1s;
        }
        .submit-btn:hover { background-color: var(--primary-hover); }
        .submit-btn:active { transform: scale(0.98); }

        .status { margin-top: 1rem; text-align: center; font-size: 0.9rem; display: none; }
        .status.success { color: var(--accent); display: block; }
        .status.error { color: #ef4444; display: block; }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="header">
            <h1>Configuración de Proyecto</h1>
            <p>Ajusta los parámetros para la generación automática en el servidor.</p>
        </div>

        <form id="produccionForm">
            <div class="form-group">
                <label for="titulo">Título del Proyecto</label>
                <input type="text" id="titulo" placeholder="Ej: El misterio de la ciudad perdida" required>
            </div>

            <div class="form-group">
                <label for="url">URL de Referencia (YouTube)</label>
                <input type="url" id="url" placeholder="https://youtube.com/watch?v=..." required>
            </div>

            <div class="form-group">
                <label for="nicho">Nicho Visual</label>
                <select id="nicho">
                    <option value="misterio">Misterio (Oscuro, Cinematográfico)</option>
                    <option value="historia">Historia (Óleo, Clásico)</option>
                    <option value="ciencia">Ciencia (Nítido, Iluminado)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Duración Objetivo (Minutos)</label>
                <div class="slider-container">
                    <input type="range" id="duracion" min="1" max="60" value="10" oninput="updateVal('duracionVal', this.value)">
                    <span class="val-display" id="duracionVal">10 min</span>
                </div>
            </div>

            <div class="form-group">
                <label>Cantidad de Shorts Extra</label>
                <div class="slider-container">
                    <input type="range" id="shorts" min="0" max="10" value="3" oninput="updateVal('shortsVal', this.value)">
                    <span class="val-display" id="shortsVal">3</span>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="btnSubmit">Añadir a la Cola de Renderizado</button>
            <div id="statusMsg" class="status"></div>
        </form>
    </div>

    <script>
        function updateVal(elementId, value) {
            const suffix = elementId === 'duracionVal' ? ' min' : '';
            document.getElementById(elementId).innerText = value + suffix;
        }

        document.getElementById('produccionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const status = document.getElementById('statusMsg');
            
            btn.innerText = 'Enviando...';
            btn.disabled = true;
            status.className = 'status';

            const payload = {
                titulo: document.getElementById('titulo').value,
                url: document.getElementById('url').value,
                nicho: document.getElementById('nicho').value,
                duracion: parseInt(document.getElementById('duracion').value),
                shorts: parseInt(document.getElementById('shorts').value)
            };

            try {
                // Reemplaza con la URL real de tu API en Render o servidor local
                const response = await fetch('https://tu-api.onrender.com/api/encolar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    status.innerText = '¡Proyecto añadido exitosamente a la cola!';
                    status.className = 'status success';
                    document.getElementById('produccionForm').reset();
                    updateVal('duracionVal', '10');
                    updateVal('shortsVal', '3');
                } else {
                    throw new Error('Error en el servidor');
                }
            } catch (error) {
                status.innerText = 'Error al conectar con la base de datos.';
                status.className = 'status error';
            } finally {
                btn.innerText = 'Añadir a la Cola de Renderizado';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
