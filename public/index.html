<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Autónomo | Enigmas Históricos</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
            color: var(--primary);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }
        .error { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #b91c1c; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Centro de Producción</h1>
        <p class="subtitle">Ingresa la referencia para generar el próximo video.</p>

        <form id="videoForm">
            <div class="form-group">
                <label for="titulo">Título Sugerido (Clickbait)</label>
                <input type="text" id="titulo" placeholder="Ej: El misterio oculto del SS Waratah..." required>
            </div>

            <div class="form-group">
                <label for="url">Enlace del Video Viral (Inglés)</label>
                <input type="url" id="url" placeholder="https://youtube.com/watch?v=..." required>
            </div>

            <div class="form-group">
                <label for="miniatura">Idea para la Miniatura</label>
                <input type="text" id="miniatura" placeholder="Ej: Barco oxidado en el fondo del mar oscuro" required>
            </div>

            <button type="submit">Enviar a la Cola de Renderizado</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script>
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            const statusBox = document.getElementById('status-message');
            btn.textContent = 'Enviando...';
            btn.disabled = true;

            const datos = {
                titulo: document.getElementById('titulo').value,
                url: document.getElementById('url').value,
                miniatura: document.getElementById('miniatura').value
            };

            try {
                const response = await fetch('/api/nuevo-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await response.json();

                if (response.ok) {
                    statusBox.textContent = resultado.mensaje;
                    statusBox.className = 'success';
                    e.target.reset();
                } else {
                    throw new Error(resultado.error || 'Error desconocido');
                }
            } catch (error) {
                statusBox.textContent = 'Error: ' + error.message;
                statusBox.className = 'error';
            } finally {
                statusBox.style.display = 'block';
                btn.textContent = 'Enviar a la Cola de Renderizado';
                btn.disabled = false;
                
                setTimeout(() => { statusBox.style.display = 'none'; }, 5000);
            }
        });
    </script>
</body>
</html>
